spring:
  application:
    name: attendance-system
  # H2 file-based database - data tersimpan permanen di file ./data/attendance_db.mv.db
  # Data tidak akan hilang saat aplikasi di-restart.
  # To use MySQL instead, replace these values with your MySQL URL/credentials or create
  # an `application-mysql.yml` and activate the profile.
  datasource:
    url: jdbc:h2:file:./data/attendance_db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:insert-test-data.sql
  main:
    allow-bean-definition-overriding: true

server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: INFO
    com.attendance: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
# Development notes:
#
# - If you don't have MySQL running and want to run the app quickly, start with an in-memory H2 database:
#   mvn spring-boot:run -Dspring-boot.run.arguments="--spring.datasource.url=jdbc:h2:mem:attendance_db --spring.datasource.driver-class-name=org.h2.Driver --spring.jpa.database-platform=org.hibernate.dialect.H2Dialect --spring.jpa.hibernate.ddl-auto=update"
#
# - To use MySQL, ensure the DB server is running and the credentials above are correct.
